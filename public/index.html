<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Coach</title>
<meta name="description" content="Personal chess training built from your own chess.com games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='5' fill='%23eaa62c'/%3E%3Cpath d='M8 21h10M9.5 18.5h7l-1-6h-5zM9 9V5.5h2v1.5h1.5V5.5h1V7H15V5.5h2V9l-1.5 1.5h-5z' fill='%23231700'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2.0.0">
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#/today"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="5" fill="#eaa62c"/><path d="M8 21h10M9.5 18.5h7l-1-6h-5zM9 9V5.5h2v1.5h1.5V5.5h1V7H15V5.5h2V9l-1.5 1.5h-5z" fill="#231700"/></svg>Chess Coach</a>
    <nav id="nav" aria-label="Sections">
      <a href="#/today" data-nav="today"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 6v4l2.5 2"/></svg><span>Today</span></a>
      <a href="#/train" data-nav="train"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.8"/></svg><span>Train</span></a>
      <a href="#/games" data-nav="games"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/></svg><span>Games</span></a>
      <a href="#/insights" data-nav="insights"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg><span>Insights</span></a>
      <a href="#/openings" data-nav="openings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V9M10 9L5 4M10 9l5-5"/></svg><span>Openings</span></a>
      <a href="#/coach" data-nav="coach"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12v8H9l-4 3v-3H4z"/></svg><span>Coach</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.5 1.5M13.5 13.5L15 15M5 15l1.5-1.5M13.5 6.5L15 5"/></svg><span>Settings</span></a>
    </nav>
    <div class="syncbox">
      <p id="who" class="small muted"></p>
      <button class="btn small" id="sync">Get new games</button>
      <div id="syncbar" class="ptrack" hidden><div id="syncfill" class="pfill"></div></div>
      <p id="syncline" class="small muted" aria-live="polite"></p>
      <button class="btn ghost small" id="pause" hidden>Pause</button>
    </div>
  </aside>
  <main id="view"><p class="muted">Loading…</p></main>
</div>
<div id="toast" hidden role="status"></div>
<script src="js/vendor/chess.js?v=2.0.0"></script>
<script src="js/pieces.js?v=2.0.0"></script>
<script src="js/core.js?v=2.0.0"></script>
<script src="js/base.js?v=2.0.0"></script>
<script src="js/analysis.js?v=2.0.0"></script>
<script src="js/board.js?v=2.0.0"></script>
<script src="js/ui-core.js?v=2.0.0"></script>
<script src="js/ui-train.js?v=2.0.0"></script>
<script src="js/ui-pages.js?v=2.0.0"></script>
</body>
</html>
